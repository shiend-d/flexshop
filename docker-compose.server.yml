services:
  db:
    image: postgres:15-alpine
    container_name: flexshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flexshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flexshop}
      POSTGRES_DB: ${POSTGRES_DB:-flexshop}
    volumes:
      - flexshop_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flexshop} -d ${POSTGRES_DB:-flexshop}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flexshop

  app:
    image: ${APP_IMAGE:?APP_IMAGE belum diatur di .env}
    container_name: flexshop-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flexshop}:${POSTGRES_PASSWORD:-flexshop}@db:5432/${POSTGRES_DB:-flexshop}
      JWT_SECRET: ${JWT_SECRET:-ubah-secret-ini}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flexshop

volumes:
  flexshop_pgdata:

networks:
  flexshop:
    driver: bridge
